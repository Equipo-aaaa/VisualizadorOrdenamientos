<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba — Estándar de eventos</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1419; color: #e6e6e6; margin: 24px; }
    h1 { font-size: 1.3rem; }
    .controles { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    button { background: #1f2a33; color: #e6e6e6; border: 1px solid #33424f; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #2a3844; }
    #lienzo { display: flex; align-items: flex-end; gap: 2px; height: 300px; background: #151c22; padding: 8px; border-radius: 8px; }
    .barra { flex: 1; background: #1f8a9c; border-radius: 2px 2px 0 0; transition: height 80ms; }
    .barra.comparando  { background: #e0b034; }
    .barra.escribiendo { background: #e0455a; }
    .barra.ordenado    { background: #3ecf8e; }
    #pruebas li.ok   { color: #3ecf8e; }
    #pruebas li.fail { color: #e0455a; }
    .leyenda span { margin-right: 12px; }
    .leyenda i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 2px; }
  </style>
</head>
<body>
  <h1>Prueba del estándar de eventos — Insertion Sort</h1>

  <h2>Pruebas automáticas</h2>
  <ul id="pruebas"></ul>

  <h2>Animación</h2>
  <div class="controles">
    <label>Tamaño: <input id="tamano" type="range" min="5" max="100" value="30"> <span id="tamanoTxt">30</span></label>
    <button id="btnNuevo">Nuevo arreglo</button>
    <button id="btnPlay">▶ Reproducir</button>
    <button id="btnPausa">⏸ Pausar</button>
    <button id="btnPaso">⏭ Paso</button>
    <button id="btnReiniciar">↺ Reiniciar</button>
    <label>Velocidad (ms): <input id="velocidad" type="range" min="1" max="300" value="40"></label>
  </div>
  <div class="leyenda">
    <span><i style="background:#1f8a9c"></i>Inactivo</span>
    <span><i style="background:#e0b034"></i>Comparación</span>
    <span><i style="background:#e0455a"></i>Escritura / intercambio</span>
    <span><i style="background:#3ecf8e"></i>Ordenado</span>
  </div>
  <p id="progreso">Evento 0 / 0</p>
  <div id="lienzo"></div>

  <script type="module">
    import { insertionSort } from '../js/algoritmos/insertionSort.js';
    import { TIPOS } from '../js/core/eventos.js';
    import { Barras } from '../js/visualizador/barras.js';
    import { Reproductor } from '../js/visualizador/reproductor.js';

    // ---------- Pruebas automáticas ----------

    // Aplica los eventos sobre una copia sin DOM. Si el estándar es correcto,
    // el resultado debe ser igual al que devuelve el algoritmo.
    function aplicarEventos(inicial, eventos) {
      const arr = [...inicial];
      for (const e of eventos) {
        if (e.type === TIPOS.SWAP) [arr[e.i], arr[e.j]] = [arr[e.j], arr[e.i]];
        if (e.type === TIPOS.OVERWRITE) arr[e.i] = e.valor;
      }
      return arr;
    }

    const iguales = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
    const aleatorio = (n) => Array.from({ length: n }, () => Math.floor(Math.random() * 100) + 1);

    const lista = document.getElementById('pruebas');
    function prueba(nombre, condicion) {
      const li = document.createElement('li');
      li.className = condicion ? 'ok' : 'fail';
      li.textContent = `${condicion ? '✔' : '✘'} ${nombre}`;
      lista.appendChild(li);
      (condicion ? console.log : console.error)(li.textContent);
    }

    // Caso pequeño para revisar a mano
    const ejemplo = [5, 2, 4, 1];
    const eventosEjemplo = [];
    const resEjemplo = insertionSort(ejemplo, eventosEjemplo);
    console.log('Entrada:', ejemplo, '→ Salida:', resEjemplo);
    console.table(eventosEjemplo);

    prueba('Ordena [5, 2, 4, 1] → [1, 2, 4, 5]', iguales(resEjemplo, [1, 2, 4, 5]));
    prueba('No modifica el arreglo original', iguales(ejemplo, [5, 2, 4, 1]));

    // Casos borde y 200 arreglos aleatorios
    const casos = [[], [7], [1, 2, 3], [3, 2, 1], [4, 4, 4], [2, 1, 2, 1]];
    for (let k = 0; k < 200; k++) casos.push(aleatorio(Math.floor(Math.random() * 60)));

    let ordenaBien = true, replayBien = true, sinEventosBien = true, doneBien = true;
    for (const c of casos) {
      const esperado = [...c].sort((a, b) => a - b);
      const ev = [];
      const res = insertionSort(c, ev);
      if (!iguales(res, esperado)) ordenaBien = false;
      if (!iguales(aplicarEventos(c, ev), res)) replayBien = false;
      if (!iguales(insertionSort(c), res)) sinEventosBien = false;
      if (ev.filter((e) => e.type === TIPOS.DONE).length !== c.length) doneBien = false;
    }

    prueba('Ordena correctamente casos borde y 200 arreglos aleatorios', ordenaBien);
    prueba('Reproducir los eventos reconstruye el resultado (estándar completo)', replayBien);
    prueba('Sin lista de eventos (modo benchmark) da el mismo resultado', sinEventosBien);
    prueba('Emite exactamente un done por elemento', doneBien);

    // ---------- Animación ----------

    const $ = (id) => document.getElementById(id);
    const barras = new Barras($('lienzo'));
    const reproductor = new Reproductor(barras, {
      velocidad: Number($('velocidad').value),
      alAvanzar: (i, total) => { $('progreso').textContent = `Evento ${i} / ${total}`; },
    });

    let arregloActual = [];
    function nuevoArreglo() {
      arregloActual = aleatorio(Number($('tamano').value));
      const eventos = [];
      insertionSort(arregloActual, eventos);
      reproductor.cargar(arregloActual, eventos);
    }

    $('tamano').oninput = (e) => { $('tamanoTxt').textContent = e.target.value; };
    $('tamano').onchange = nuevoArreglo;
    $('btnNuevo').onclick = nuevoArreglo;
    $('btnPlay').onclick = () => reproductor.reproducir();
    $('btnPausa').onclick = () => reproductor.pausar();
    $('btnPaso').onclick = () => { reproductor.pausar(); reproductor.paso(); };
    $('btnReiniciar').onclick = () => reproductor.reiniciar();
    $('velocidad').oninput = (e) => reproductor.setVelocidad(Number(e.target.value));

    nuevoArreglo();
  </script>
</body>
</html>
